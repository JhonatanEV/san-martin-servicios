<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Edificio San Martín · Control de Servicios</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- HEADER PRINCIPAL -->
  <header>
    <div class="top-bar">
      <div class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
            <path d="M9 22v-4h6v4"></path>
            <path d="M8 6h.01"></path><path d="M16 6h.01"></path><path d="M12 6h.01"></path>
            <path d="M12 10h.01"></path><path d="M12 14h.01"></path><path d="M16 10h.01"></path>
            <path d="M16 14h.01"></path><path d="M8 10h.01"></path><path d="M8 14h.01"></path>
          </svg>
        </div>
        <div>
          <h1>Edificio San Martín</h1>
          <small>Agua, Luz y Aportes Comunes</small>
        </div>
      </div>
      <nav id="nav">
        <button data-v="month" class="active">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          <span>Control Mensual</span>
        </button>
        <button data-v="year">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          <span>Resumen Anual</span>
        </button>
        <button data-v="receipt">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
          <span>Recibos WhatsApp</span>
        </button>
        <button data-v="users" id="nav-btn-users" style="display:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <span>Usuarios</span>
        </button>
        <button data-v="cfg" id="nav-btn-cfg" style="display:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          <span>Configuración & Drive</span>
        </button>
      </nav>
      <div id="header-actions"></div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main id="app">
    <!-- FILTRO DE AÑO Y MESES -->
    <section id="filter-bar-container"></section>

    <!-- 1. VISTA: CONTROL MENSUAL -->
    <section id="view-month" class="view-panel active">
      <div id="month-kpis-container"></div>
      <div id="month-alerts-container"></div>
      <div id="month-empty-state" style="display:none;"></div>

      <div id="month-content-wrapper">
        <!-- SUB-PESTAÑAS DEL MES -->
        <div class="subtabs-bar noprint">
          <button class="subtab-btn active" data-subtab="tab-lecturas">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
            Lecturas y Cálculo
          </button>
          <button class="subtab-btn" data-subtab="tab-aportes">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
            Aportes y Mantenimiento
          </button>
          <button class="subtab-btn" data-subtab="tab-cobranza">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
            Control de Cobranza y Saldos
          </button>
        </div>

        <!-- SUB-TAB 1: LECTURAS Y RECIBOS -->
        <div id="tab-lecturas" class="subtab-content active">
          <!-- Recibos Generales -->
          <div class="card">
            <div class="card-header">
              <h3 class="card-title" id="receipts-title">Recibos Generales</h3>
            </div>
            <div class="form-grid-4">
              <div class="form-group">
                <label>Recibo Sedapal / Agua (S/)</label>
                <input type="number" step="0.01" data-action="field" data-prop="w" id="field-w" placeholder="0.00">
              </div>
              <div class="form-group">
                <label>Recibo Luz Área Común (S/)</label>
                <input type="number" step="0.01" data-action="field" data-prop="e" id="field-e" placeholder="0.00">
              </div>
              <div class="form-group">
                <label>Lectura Desde</label>
                <input type="date" data-action="field" data-prop="d0" id="field-d0">
              </div>
              <div class="form-group">
                <label>Lectura Hasta</label>
                <input type="date" data-action="field" data-prop="d1" id="field-d1">
              </div>
            </div>
          </div>

          <!-- Tabla y Cards de lecturas -->
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Lecturas de Submedidores y Cálculo por Departamento</h3>
            </div>
            <div id="readings-table-container"></div>
          </div>
        </div>

        <!-- SUB-TAB 2: APORTES Y MANTENIMIENTO -->
        <div id="tab-aportes" class="subtab-content">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Aportes y Mantenimiento (Tanque de Agua, Bombas, Luces)</h3>
            </div>
            <div id="charges-presets-container"></div>
            <div id="charges-list-container"></div>
          </div>
        </div>

        <!-- SUB-TAB 3: CONTROL DE COBRANZAS -->
        <div id="tab-cobranza" class="subtab-content">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Control de Cobranza, Pagos y Saldos</h3>
            </div>
            <div id="payments-table-container"></div>
            <div id="payments-footer-container"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 2. VISTA: RESUMEN ANUAL -->
    <section id="view-year" class="view-panel"></section>

    <!-- 3. VISTA: RECIBOS WHATSAPP -->
    <section id="view-receipt" class="view-panel"></section>

    <!-- 4. VISTA: GESTIÓN DE USUARIOS (ADMIN) -->
    <section id="view-users" class="view-panel"></section>

    <!-- 5. VISTA: CONFIGURACIÓN & DRIVE (ADMIN) -->
    <section id="view-cfg" class="view-panel"></section>
  </main>

  <!-- MODAL DE LOGIN POR DNI -->
  <div id="login-overlay" style="display:none;"></div>

  <!-- TOAST NOTIFICACIONES -->
  <div id="toast"></div>

  <!-- SCRIPTS -->
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
